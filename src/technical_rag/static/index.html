
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technical RAG Copilot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #0b1220;
      color: #e2e8f0;
    }

    .app {
      max-width: 900px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #283449;
    }

    header h1 {
      font-size: 21px;
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
      color: #94a3b8;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 20px;
    }

    .message {
      margin-bottom: 22px;
      padding: 17px;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #1e3a5f;
      margin-left: 12%;
    }

    .assistant {
      background: #172235;
      margin-right: 8%;
    }

    .role {
      font-size: 12px;
      font-weight: bold;
      color: #93c5fd;
      margin-bottom: 8px;
    }

    .answer {
      white-space: pre-wrap;
    }

    .sources {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      font-size: 13px;
      white-space: normal;
    }

    .source {
      padding: 8px 0;
    }

    .source a {
      color: #93c5fd;
      text-decoration: none;
    }

    .source a:hover {
      text-decoration: underline;
    }

    .source small {
      display: block;
      color: #94a3b8;
    }

    .timing {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
    }

    form {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #0b1220;
      border-top: 1px solid #283449;
    }

    textarea {
      flex: 1;
      background: #172235;
      color: white;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      font: inherit;
      resize: none;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .user, .assistant {
        margin-left: 0;
        margin-right: 0;
      }

      form {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>Technical RAG Copilot</h1>
      <p>Evidence-grounded answers from technical documentation</p>
    </header>

    <main id="messages" aria-live="polite">
      <div class="message assistant">
        <div class="role">Assistant</div>
        Hello! Ask me a question about the technical
        documentation in my knowledge base.
      </div>
    </main>

    <form id="chat-form">
      <textarea
        id="question"
        rows="2"
        maxlength="1000"
        placeholder="Ask a technical question..."
        required
      ></textarea>

      <button id="send" type="submit">Send</button>
    </form>

  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("send");

    function addMessage(role, text) {
      const message = document.createElement("div");
      message.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "role";
      label.textContent = role === "user" ? "You" : "Assistant";

      const body = document.createElement("div");
      body.className = "answer";
      body.textContent = text;

      message.append(label, body);
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    function showSources(message, evidence) {
      if (!evidence || evidence.length === 0) {
        return;
      }

      const details = document.createElement("details");
      details.className = "sources";

      const summary = document.createElement("summary");
      summary.textContent = `Sources (${evidence.length})`;
      details.appendChild(summary);

      for (const item of evidence) {
        const source = document.createElement("div");
        source.className = "source";

        const title = `[${item.citation_id}] ${item.document_title}`;

        let validUrl = null;

        try {
          const url = new URL(item.source_url);

          if (["http:", "https:"].includes(url.protocol)) {
            validUrl = url.href;
          }
        } catch {
          // Missing or invalid source URL
        }

        if (validUrl) {
          const link = document.createElement("a");
          link.href = validUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = title;
          source.appendChild(link);
        } else {
          source.textContent = title;
        }

        const section = document.createElement("small");
        section.textContent = item.section_title || "Documentation";
        source.appendChild(section);

        details.appendChild(source);
      }

      message.appendChild(details);
    }

    async function askQuestion(question) {
      addMessage("user", question);

      const message = addMessage("assistant", "Thinking...");

      sendButton.disabled = true;
      input.disabled = true;

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        if (!response.ok) {
          throw new Error(`Request failed: HTTP ${response.status}`);
        }

        const data = await response.json();

        message.querySelector(".answer").textContent = data.answer;

        showSources(message, data.evidence);

        const timing = document.createElement("div");
        timing.className = "timing";
        timing.textContent =
          `Completed in ${data.timing_seconds.total}s`;

        message.appendChild(timing);

      } catch (error) {
        message.querySelector(".answer").textContent =
          `An error occurred: ${error.message}`;
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const question = input.value.trim();

      if (!question || sendButton.disabled) {
        return;
      }

      input.value = "";
      askQuestion(question);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>

</body>
</html>
