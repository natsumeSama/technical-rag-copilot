[project]
name = "technical-rag-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yudas", email = "84617860+natsumeSama@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.12",
    "fastapi>=0.146.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "pystemmer>=3.1.0",
    "python-frontmatter>=1.3.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
technical-rag-copilot = "technical_rag_copilot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "technical_rag"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
